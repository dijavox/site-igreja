backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "avisos"
    label: "Avisos da Igreja"
    folder: "content/avisos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Aviso", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "date", widget: "datetime" }
      - { label: "Conteúdo do Recado", name: "body", widget: "markdown" }